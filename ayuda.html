  <style>
    /* ============================================================
       Estilos específicos del centro de ayuda
       ============================================================ */

    /* HERO compacto */
    .help-hero {
      position: relative;
      padding: 60px 0 20px;
      overflow: hidden;
    }
    .help-hero .container { position: relative; z-index: 1; }
    .help-hero h1 { margin-bottom: var(--s-lg); max-width: 760px; }
    .help-hero .lead {
      font-size: 1.15rem;
      color: var(--muted);
      max-width: 620px;
      margin-bottom: 0;
    }

    /* SECCIÓN GENÉRICA */
    section { padding: 60px 0; }
    @media (max-width: 700px) { section { padding: 44px 0; } }

    /* GRUPOS DE PREGUNTAS */
    .help-group { max-width: 820px; margin: 0 auto 48px; }
    .help-group:last-of-type { margin-bottom: 0; }
    .help-group-title {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 var(--s-md);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .help-group-title .ic {
      width: 40px; height: 40px;
      flex: 0 0 40px;
      background: var(--accent-tint);
      color: var(--accent);
      border-radius: var(--r-md);
      display: grid;
      place-items: center;
    }
    .help-group-title .ic svg { width: 20px; height: 20px; }

    /* Acordeón (réplica del FAQ de la home) */
    .faq-list { max-width: 820px; margin: 0 auto; }
    .faq-item {
      border-bottom: 1px solid var(--border);
      padding: var(--s-sm) 0;
    }
    .faq-item summary {
      list-style: none;
      cursor: pointer;
      padding: var(--s-lg) 0;
      font-weight: 700;
      font-size: 1.02rem;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      transition: color .15s ease;
    }
    .faq-item summary:hover { color: var(--accent); }
    .faq-item summary::-webkit-details-marker { display: none; }
    .faq-item summary::after {
      content: "+";
      font-size: 1.5rem;
      font-weight: 400;
      color: var(--muted);
      transition: transform .2s ease, color .2s ease;
      line-height: 1;
      flex: 0 0 auto;
    }
    .faq-item[open] summary::after { transform: rotate(45deg); color: var(--accent); }
    .faq-answer {
      padding: 0 0 var(--s-lg);
      color: var(--muted);
      max-width: 720px;
    }
    .faq-answer p { margin: 0 0 var(--s-md); color: var(--muted); }
    .faq-answer p:last-child { margin: 0; }
    .faq-answer a {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    /* BLOQUE DE CONTACTO */
    .help-contact { background: var(--surface); border-top: 1px solid var(--border); }
    .help-contact-card {
      max-width: 820px;
      margin: 0 auto;
      text-align: center;
      background: var(--dark-bg);
      border-radius: var(--r-xl);
      padding: 56px var(--s-xl);
      position: relative;
      overflow: hidden;
    }
    .help-contact-card .eyebrow { position: relative; }
    .help-contact-card h2 { color: var(--dark-text); margin-bottom: var(--s-md); position: relative; }
    .help-contact-card p { color: var(--dark-muted); max-width: 520px; margin: 0 auto var(--s-xl); position: relative; }
    .help-contact-card .btn-primary { position: relative; }
  </style>
</head>

  <script>
  /* ==============================================================
     SISTEMA DE TRADUCCIONES (i18n) — mismo motor que la landing.
     'es' completo. 'val' y 'en' vacíos: cuando la web tenga el
     switcher activo, se rellenan aquí y funcionan sin tocar el HTML.
     ============================================================== */
  const I18N = {
    es: {
      nav: { how: "Cómo funciona", where: "Dónde usar", merchants: "Comercios", security: "Seguridad", faq: "Preguntas", entradas: "Entradas" },

      help: {
        eyebrow: "Centro de ayuda",
        title:   "¿En qué podemos ayudarte?",
        lead:    "Aquí tienes las respuestas a las dudas más habituales sobre PagoLocal. Si no encuentras lo que buscas, escríbenos y te echamos una mano.",

        g1: {
          title: "Pagos y compras",
          q1: { q: "¿Cómo pago con PagoLocal?",
                a: "Abre la app, pulsa en escanear y apunta al QR del comercio. Confirma el importe y paga con tu huella o Face ID. El pago se hace al instante y, además, ganas cashback en cada compra." },
          q2: { q: "¿Necesito una tarjeta o cuenta especial?",
                a: "No. PagoLocal funciona con cualquier tarjeta de débito o crédito española que ya tengas. Se vincula a la app de forma segura y los datos nunca se guardan en tu móvil." },
          q3: { q: "Me ha fallado un pago o me han cobrado y no aparece la compra",
                a: "Primero comprueba en tu banco si el cargo se ha realizado de verdad. Si te han cobrado pero no ves la compra en la app, escríbenos a <a href=\"mailto:soporte@pagolocal.xyz\">soporte@pagolocal.xyz</a> con la hora, el importe y el comercio, y lo revisamos enseguida." },
          q4: { q: "¿Funciona sin internet?",
                a: "No. PagoLocal necesita conexión a internet (datos móviles o WiFi) para realizar pagos, porque cada operación se procesa al instante con tu banco." }
        },

        g2: {
          title: "Cashback",
          q1: { q: "¿Qué es el cashback y cómo lo uso?",
                a: "Es dinero que recuperas en cada compra para volver a gastar en el comercio local. Se acumula solo en tu saldo y lo ves en la pantalla de inicio. La próxima vez que pagues en un comercio que acepte saldo, puedes usarlo." },
          q2: { q: "No me ha llegado el cashback de una compra",
                a: "El cashback se abona al confirmarse el pago. Si no lo ves, cierra y vuelve a abrir la app para refrescar. Si pasados unos minutos sigue sin aparecer, escríbenos a <a href=\"mailto:soporte@pagolocal.xyz\">soporte@pagolocal.xyz</a> indicando la fecha y el comercio." },
          q3: { q: "¿Dónde puedo gastar mi cashback?",
                a: "En cualquier comercio PagoLocal que tenga activada la opción de aceptar saldo. Lo verás claramente indicado al elegir cómo pagar." }
        },

        g3: {
          title: "Devoluciones",
          q1: { q: "¿Cómo pido una devolución?",
                a: "Las devoluciones las gestiona el comercio donde compraste. Habla con ellos: generarán un QR de reembolso que escaneas con tu app para recuperar el importe. El saldo se ajusta automáticamente." }
        },

        g4: {
          title: "Seguridad y cuenta",
          q1: { q: "¿Es seguro pagar con PagoLocal?",
                a: "Sí. Los pagos se procesan a través de Cecabank, una de las pasarelas bancarias más usadas en España. PagoLocal no almacena los datos de tu tarjeta y cumple la normativa europea de pagos (PSD2)." },
          q2: { q: "¿Puedo usar huella o Face ID?",
                a: "Sí. Actívalo desde tu perfil para entrar en la app y confirmar tus pagos sin escribir la contraseña." },
          q3: { q: "¿Qué pasa si pierdo el móvil?",
                a: "Tu dinero está a salvo: nadie puede acceder a la app sin tu huella o Face ID. Si quieres dar de baja tu cuenta, escríbenos a <a href=\"mailto:soporte@pagolocal.xyz\">soporte@pagolocal.xyz</a>." },
          q4: { q: "¿En qué idiomas está la app?",
                a: "En español, valencià e inglés. Puedes cambiar el idioma desde los ajustes de la app." },
          q5: { q: "¿Cómo doy de baja mi cuenta o borro mis datos?",
                a: "Escríbenos a <a href=\"mailto:soporte@pagolocal.xyz\">soporte@pagolocal.xyz</a> desde el email de tu cuenta y tramitaremos la baja y el borrado de tus datos conforme al RGPD." }
        },

        contact: {
          eyebrow: "¿No encuentras tu respuesta?",
          title:   "Estamos aquí para ayudarte",
          lead:    "Escríbenos y te responderemos lo antes posible. Cuéntanos qué ha pasado, en qué comercio y a qué hora, y lo resolvemos.",
          cta:     "Escribir a soporte"
        }
      },

      footer: {
        tagline: "La app de pago del comercio local de Ontinyent. Hecho aquí, para los de aquí.",
        col1: { title: "PagoLocal",  l1: "Cómo funciona", l2: "Dónde usar",       l3: "Seguridad",      l4: "Preguntas frecuentes", l5: "Entradas" },
        col2: { title: "Comercios",  l1: "Para comercios", l2: "Únete a la red",  l3: "Contacto" },
        col3: { title: "Legal",      l1: "Política de privacidad", l2: "Términos y condiciones" },
        madeIn: "Hecho en Ontinyent"
      }
    },

    val: {},
    en:  {}
  };

  let currentLang = 'es';

  function t(key) {
    const path = key.split('.');
    let val = I18N[currentLang];
    for (const p of path) val = val && val[p];
    if (val === undefined || val === null || val === '') {
      val = I18N.es;
      for (const p of path) val = val && val[p];
    }
    return val ?? '';
  }

  function applyLang() {
    document.documentElement.lang = currentLang === 'val' ? 'ca' : currentLang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.dataset.i18n);
    });
    document.querySelectorAll('[data-i18n-html]').forEach(el => {
      el.innerHTML = t(el.dataset.i18nHtml);
    });
    document.querySelectorAll('.lang-switch button').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === currentLang);
    });
  }

  document.querySelectorAll('.lang-switch button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      currentLang = btn.dataset.lang;
      applyLang();
    });
  });

  applyLang();

  /* MENÚ MÓVIL */
  document.getElementById('menuToggle').addEventListener('click', () => {
    document.getElementById('navLinks').classList.toggle('open');
  });
  document.querySelectorAll('#navLinks a').forEach(a => {
    a.addEventListener('click', () => document.getElementById('navLinks').classList.remove('open'));
  });

  document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
