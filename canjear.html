<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canjear tarjeta regalo · PagoLocal</title>
<meta name="description" content="Te han regalado una tarjeta de saldo en PagoLocal. Canjéala en la app.">
<meta name="theme-color" content="#F5F7FB">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%231A1A2E'/%3E%3Cpath d='M55 18 L29 56 h17 l-5 26 27-42 H51 l4-22 z' fill='%23F5C842'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#F5F7FB; --card:#FFFFFF; --text:#1A1A2E; --muted:#6B7280; --border:#E2E5EE; --accent:#B07908; --accent-tint:#FBF6E8; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Inter',-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; }
  .wrap{ width:100%; max-width:440px; }
  .brand{ display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:24px; font-weight:800; }
  .brand svg{ width:26px; height:26px; }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:18px; padding:28px 24px; box-shadow:0 8px 28px rgba(20,20,40,.06); }
  .gift{ width:52px; height:52px; border-radius:14px; background:var(--accent-tint); color:var(--accent); display:grid; place-items:center; margin:0 auto 14px; }
  .gift svg{ width:26px; height:26px; }
  h1{ font-size:22px; font-weight:800; margin:0 0 6px; text-align:center; }
  p.sub, .none{ color:var(--muted); font-size:15px; line-height:1.55; margin:0 0 22px; text-align:center; }
  .codebox{ background:var(--bg); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:10px; text-align:center; }
  .codelabel{ color:var(--muted); font-size:12px; font-weight:600; margin-bottom:6px; }
  .code{ color:var(--text); font-size:24px; font-weight:800; letter-spacing:2px; word-break:break-all; font-variant-numeric:tabular-nums; }
  .copy{ display:block; margin:0 auto 24px; background:transparent; color:var(--accent); border:1px solid var(--border); border-radius:10px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
  .copy:active{ opacity:.7; }
  .steps{ list-style:none; padding:0; margin:0 0 24px; }
  .step{ display:flex; align-items:flex-start; gap:12px; padding:10px 0; border-top:1px solid var(--border); font-size:14px; line-height:1.5; }
  .num{ flex:0 0 24px; width:24px; height:24px; border-radius:50%; background:var(--accent-tint); color:var(--accent); font-weight:700; font-size:13px; display:grid; place-items:center; }
  .store{ display:flex; align-items:center; justify-content:center; background:var(--accent); color:#fff; text-decoration:none; font-weight:700; font-size:15px; border-radius:12px; padding:14px 22px; width:100%; }
  .ios{ color:var(--muted); font-size:12px; margin-top:12px; text-align:center; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#1A1A2E"/><path d="M55 18 L29 56 h17 l-5 26 27-42 H51 l4-22 z" fill="#F5C842"/></svg>
      <span>PagoLocal</span>
    </div>

    <div id="content" class="card"></div>
  </div>

<script>
  (function(){
    function getParam(name){
      var m = new RegExp('[?&]' + name + '=([^&]+)').exec(window.location.search);
      return m ? decodeURIComponent(m[1].replace(/\+/g,' ')) : '';
    }
    function esc(str){ return String(str||'').replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

    var codigo = (getParam('codigo') || '').trim();
    var PLAY = 'https://play.google.com/store/apps/details?id=xyz.pagolocal.usuario';
    var content = document.getElementById('content');

    if(!codigo){
      content.innerHTML =
        '<div class="gift"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13"/><path d="M12 8C10 8 7.5 7 7.5 5a2 2 0 0 1 4-.5L12 8zM12 8c2 0 4.5-1 4.5-3a2 2 0 0 0-4-.5L12 8z"/></svg></div>'+
        '<h1>Tarjetas regalo PagoLocal</h1>'+
        '<p class="none">Este enlace sirve para canjear una tarjeta regalo, pero no trae ningún código.<br>Pide a quien te la regala que comparta de nuevo el enlace o el código.</p>'+
        '<a class="store" href="'+PLAY+'">Descargar PagoLocal</a>';
      return;
    }

    content.innerHTML =
      '<div class="gift"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13"/><path d="M12 8C10 8 7.5 7 7.5 5a2 2 0 0 1 4-.5L12 8zM12 8c2 0 4.5-1 4.5-3a2 2 0 0 0-4-.5L12 8z"/></svg></div>'+
      '<h1>¡Te han regalado saldo!</h1>'+
      '<p class="sub">Alguien te ha regalado una tarjeta de saldo para gastar en un comercio local. Canjéala en la app de PagoLocal.</p>'+
      '<div class="codebox">'+
        '<div class="codelabel">Tu código</div>'+
        '<div class="code" id="code">'+esc(codigo)+'</div>'+
      '</div>'+
      '<button class="copy" id="copyBtn">Copiar código</button>'+
      '<div class="steps">'+
        '<div class="step"><div class="num">1</div><div>Descarga <b>PagoLocal</b> y crea tu cuenta (es gratis).</div></div>'+
        '<div class="step"><div class="num">2</div><div>Entra en <b>Mis tarjetas regalo</b> y pulsa <b>Canjear código</b>.</div></div>'+
        '<div class="step"><div class="num">3</div><div>Pega el código y listo: el saldo será tuyo.</div></div>'+
      '</div>'+
      '<a class="store" href="'+PLAY+'">Descargar PagoLocal</a>'+
      '<div class="ios">En iPhone: próximamente en la App Store.</div>';

    var btn = document.getElementById('copyBtn');
    if(btn){
      btn.addEventListener('click', function(){
        var txt = codigo;
        function done(){ btn.textContent = 'Copiado'; setTimeout(function(){ btn.textContent = 'Copiar código'; }, 1800); }
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(txt).then(done).catch(done);
        } else {
          var r = document.createRange(); r.selectNode(document.getElementById('code'));
          var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
          try{ document.execCommand('copy'); }catch(e){}
          sel.removeAllRanges(); done();
        }
      });
    }
  })();
</script>
</body>
</html>
